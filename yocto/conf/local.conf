# build.sh가 매 빌드마다 /work/build/conf/local.conf로 복사한다.

# 대상 보드. 환경 변수 MACHINE으로 덮어쓸 수 있다 (예: raspberrypi4-64).
MACHINE ??= "qemuarm64"

DISTRO ?= "poky"
INIT_MANAGER = "systemd"
PACKAGE_CLASSES ?= "package_ipk"

# 프린트 서버에 필요 없는 기능을 빼서 X11/mesa/LLVM 등이 빌드되지 않게 한다.
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan alsa bluetooth pcmcia 3g nfc ptest gobject-introspection-data"

DL_DIR = "/work/downloads"
SSTATE_DIR = "/work/sstate-cache"
BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"
# 레시피별 작업 폴더를 빌드 후 지워 디스크를 아낀다.
INHERIT += "rm_work"

hostname:pn-base-files = "printpi"

# 개발 중에는 root 빈 비밀번호로 SSH 접속을 허용한다. 배포 전에 지울 것.
EXTRA_IMAGE_FEATURES ?= "allow-empty-password empty-root-password allow-root-login"
# 개발용 도구: Bonjour 광고 확인(avahi-browse)
CORE_IMAGE_EXTRA_INSTALL += "avahi-utils"

BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K"

CONF_VERSION = "2"
