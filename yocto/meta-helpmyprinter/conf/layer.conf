BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "helpmyprinter"
BBFILE_PATTERN_helpmyprinter = "^${LAYERDIR}/"
BBFILE_PRIORITY_helpmyprinter = "10"

LAYERDEPENDS_helpmyprinter = "core openembedded-layer"
LAYERSERIES_COMPAT_helpmyprinter = "wrynose"
