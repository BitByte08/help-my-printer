# wpa_supplicant@.service 드롭인: wifi.txt로 만든 설정이 있을 때만 띄우고,
# 와이파이 절전을 끈다(절전 중에는 mDNS를 놓쳐 휴대전화에서 프린터가 안 보이거나 깜빡인다).
[Unit]
Wants=printpi-wifi.service
After=printpi-wifi.service
ConditionPathExists=/etc/wpa_supplicant/wpa_supplicant-%i.conf

[Service]
ExecStartPost=-/usr/sbin/iw dev %i set power_save off
